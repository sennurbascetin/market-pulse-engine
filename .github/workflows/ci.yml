name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # The suite mocks every external API and runs against a throwaway
        # DuckDB file, so it needs no network access and no credentials.
        run: pytest -q

      - name: Verify the schema builds from scratch
        run: python -m market_pulse_engine.db.init

      - name: Verify the package installs with its SQL assets
        # The transforms live in .sql files shipped as package data. If that
        # wiring ever breaks, an installed copy fails at runtime rather than
        # at build time — so assert it from site-packages, not the source tree.
        run: |
          pip install .
          cd "$RUNNER_TEMP"
          python -c "
          from market_pulse_engine.transforms.loader import load_sql
          from market_pulse_engine.db.init import SCHEMA_PATH
          assert 'quotes_enriched' in load_sql('gold_quotes_enriched')
          assert SCHEMA_PATH.is_file(), 'schema.sql missing from the installed package'
          print('package data OK')
          "
