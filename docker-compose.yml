services:
  market-pulse:
    build: .
    container_name: market-pulse-engine
    ports:
      - "8050:8050"
    environment:
      # Every value has a working default; these are the ones worth tuning.
      MPE_WATCHLIST: "AAPL,NVDA,TSLA,MSFT,SPY,BTC-USD,ETH-USD"
      MPE_POLL_SECONDS: "60"
      MPE_LLM_EVERY_N_RUNS: "5"
      MPE_DEMO_MODE: "false"
      # Uncomment to upgrade the analyst from the offline fallback:
      # OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    volumes:
      # Persist the warehouse across container rebuilds.
      - market-pulse-data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  market-pulse-data:
